// ===== cine-player.js =====
// ════════════════════════════════════════════════════════════
//  CINEMATIC PLAYER (replaces the text-only Player)
// ════════════════════════════════════════════════════════════
const FLASH_RGB = { good: '43,165,101', medium: '217,164,6', bad: '226,72,74' };
function flashRGBA(tier, a) { return `rgba(${FLASH_RGB[tier] || '226,72,74'},${a})`; }
function flashGlow(tier) {
  if (!tier) return 'drop-shadow(0 12px 30px rgba(0,0,0,0.6))';
  return `drop-shadow(0 0 24px ${flashRGBA(tier, 0.7)})`;
}
function charEmotion(flash, base) {
  if (flash === 'bad') return 'angry';
  if (flash === 'medium') return 'suspicious';
  return base || 'neutral';
}

function CinePlayer({ scenarioId, state, dispatch, go }) {
  const scenario = CINE_SCENARIOS[scenarioId];
  // Fallback for any non-cinematic scenario id
  if (!scenario) return <Player scenarioId={scenarioId} state={state} dispatch={dispatch} go={go} />;

  const [nodeId, setNodeId] = useState(scenario.entry);
  const [meters, setMeters] = useState({ ...scenario.startMeters });
  const [xp, setXp] = useState(0);
  const [consequence, setConsequence] = useState(null);
  const [ending, setEnding] = useState(null);
  const [drawerLaw, setDrawerLaw] = useState(null);
  const [typed, setTyped] = useState('');
  const [choicesIn, setChoicesIn] = useState(false);
  const [stress, setStress] = useState(false);   // legacy hard-fail stress flag
  const [flash, setFlash] = useState(null);       // 'good' | 'medium' | 'bad' transient screen flash
  const [runKey, setRunKey] = useState(0);        // bump to restart scenario
  const [meterFlash, setMeterFlash] = useState({}); // { key: 'up' | 'down' } transient
  const [trapReveal, setTrapReveal] = useState(null); // the trap explanation panel
  const [briefSeen, setBriefSeen] = useState(false);  // story briefing shown before play
  const [confirmExit, setConfirmExit] = useState(false); // mid-story leave confirmation

  const meterCfg = scenario.meterConfig || [];

  const node = ending ? null : scenario.nodes[nodeId];
  const endingData = ending ? scenario.endings[ending] : null;
  const activeNode = node || endingData;

  // Typewriter effect for the current content.
  // Guard against null nodes and clear BOTH the interval and the reveal timeout
  // on cleanup so a stray setState can't fire after the node changes.
  const fullText = ending
    ? (endingData ? endingData.summary : '')
    : (node ? (node.content || '') : '');
  useEffect(() => {
    if (consequence) return;
    if (!fullText) { setChoicesIn(true); return; }
    setTyped(''); setChoicesIn(false);
    let i = 0;
    const interval = setInterval(() => {
      i += 2;
      setTyped(fullText.slice(0, i));
      if (i >= fullText.length) {
        setTyped(fullText);
        clearInterval(interval);
        setChoicesIn(true);
      }
    }, 16);
    return () => { clearInterval(interval); };
  }, [nodeId, ending, consequence, fullText]);

  function applyMeters(delta = {}) {
    const keys = Object.keys(delta).filter(k => delta[k] !== 0);
    if (keys.length) {
      const flash = {};
      for (const k of keys) flash[k] = delta[k] > 0 ? 'up' : 'down';
      setMeterFlash(flash);
      setTimeout(() => setMeterFlash({}), 650);
    }
    setMeters(m => {
      const next = { ...m };
      for (const k of Object.keys(delta)) next[k] = Math.max(0, Math.min(10, (next[k] || 0) + delta[k]));
      return next;
    });
  }

  function advance(toId, addXp = 0, deltaMeters = {}) {
    applyMeters(deltaMeters);
    setXp(x => x + addXp);
    if (scenario.endings[toId]) { setEnding(toId); return; }
    setNodeId(toId);
  }

  function triggerFlash(tier) {
    setFlash(tier);
    if (tier === 'bad') { setStress(true); setTimeout(() => setStress(false), 900); }
    setTimeout(() => setFlash(null), 900);
  }

  function tierOf(c) {
    if (c.tier) return c.tier;
    if (c.bad) return 'bad';
    if (c.trap) return 'bad';
    return 'good';
  }

  function handleChoice(c) {
    triggerFlash(tierOf(c));
    if (c.consequence) setConsequence(c);
    else advance(c.to, c.xp || 0, c.meters || {});
  }

  function handleTrap(c) {
    const node = scenario.nodes[nodeId];
    if (c.trap) {
      // Fell for the trap → red flash + reveal, then route toward poor outcome
      triggerFlash('bad');
      setTrapReveal({ ...node.trapReveal, to: c.to, survived: false });
    } else {
      // Survived the trap → GREEN flash + a "why you survived" reveal
      triggerFlash('good');
      if (node.surviveReveal) {
        setTrapReveal({ ...node.surviveReveal, to: c.to, survived: true,
          xp: c.xp || 0, meters: c.meters || {} });
      } else if (c.consequence) {
        setConsequence(c);
      } else {
        advance(c.to, c.xp || 0, c.meters || {});
      }
    }
  }

  function continueFromTrap() {
    const tr = trapReveal;
    setTrapReveal(null);
    advance(tr.to, tr.xp || 0, tr.meters || {});
  }

  function restart() {
    setNodeId(scenario.entry);
    setMeters({ ...scenario.startMeters });
    setXp(0);
    setConsequence(null);
    setEnding(null);
    setTyped('');
    setChoicesIn(false);
    setStress(false);
    setFlash(null);
    setTrapReveal(null);
    setMeterFlash({});
    setRunKey(k => k + 1);
  }

  function continueFromConsequence() {
    const c = consequence; setConsequence(null);
    advance(c.to, c.xp || 0, c.meters || {});
  }

  function finish() {
    const total = Math.round((SCENARIOS.find(s=>s.id===scenarioId).xpBase + xp) * (endingData.mult || 1));
    dispatch({ type: 'COMPLETE_SCENARIO', scenarioId, xp: total, endingType: endingData.type });
    go('map');
  }

  const skip = () => { setTyped(fullText); setChoicesIn(true); };
  // "hot" = any meter with a hot color is past threshold, OR a stress reaction is active
  const anyHot = meterCfg.some(m => m.hot && (meters[m.key] || 0) > 6);
  const tensionHigh = anyHot || stress;
  // Backdrop intensity (0-10): tension if present, else risk, else a mid value
  const intensity = meters.tension != null ? meters.tension : (meters.risk != null ? meters.risk : 4);

  // ─── Stage composition ───
  // stageScene: normally the node's scene, but ending may override (e.g. jail).
  // stageChars: array of {id,x,emotion,sweat,speaking,size,label}.
  const isChoiceLike = node && (node.type === 'choice' || node.type === 'trap');
  const playerId = scenario.playerChar; // e.g. 'you' (the tenant)
  let stageScene = activeNode.scene;
  let stageChars = [];

  if (ending) {
    // ENDING: support a dualEnd config { scene, chars:[{id,emotion,sweat,label}] }
    const de = endingData.dualEnd;
    if (de) {
      if (de.scene) stageScene = de.scene;
      const n = de.chars.length;
      stageChars = de.chars.map((c, i) => ({
        id: c.id,
        x: n === 1 ? '50%' : `${Math.round((i + 1) * 100 / (n + 1))}%`,
        emotion: c.emotion || 'neutral',
        sweat: c.sweat || null,
        speaking: false,
        size: n > 1 ? 168 : 210,
        label: c.label || null,
      }));
    } else if (endingData.char) {
      stageChars = [{ id: endingData.char, x: '50%', emotion: charEmotion(flash, endingData.emotion), sweat: null, speaking: false, size: 210, label: endingData.speaker || null }];
    }
  } else if (node) {
    if (node.hideChar || node.scene === 'phone_call') {
      // POV call — the phone IS the visual; show no floating character
      stageChars = [];
    } else {
      const list = [];
      // The other character (officer / landlord / manager), if any
      if (node.char) {
        list.push({
          id: node.char,
          emotion: charEmotion(flash, node.emotion),
          sweat: flash === 'bad' ? 'heavy' : flash === 'medium' ? 'slight' : null,
          speaking: !choicesIn && node.type === 'dialogue',
          label: node.speaker || null,
          _player: false,
        });
      }
      // The player character — only at decision moments (choice/trap), if configured
      if (playerId && isChoiceLike) {
        list.push({
          id: playerId,
          emotion: charEmotion(flash, 'neutral'),
          sweat: flash === 'bad' ? 'heavy' : flash === 'medium' ? 'slight' : null,
          speaking: false,
          label: scenario.povLabel || 'You',
          _player: true,
        });
      }
      const n = list.length;
      stageChars = list.map((c, i) => ({
        ...c,
        x: n === 1 ? '50%' : (c._player ? '70%' : '30%'),
        size: n > 1 ? 176 : 210,
      }));
    }
  }

  // ─── STORY BRIEFING (laws + meter legend) shown before play ───
  if (!briefSeen && scenario.brief) {
    const meterBlurb = {
      tension: "How tense the encounter is. High tension makes things more likely to escalate.",
      trust: "Rapport with the other person. Staying calm and cooperative builds it.",
      suspicion: "How suspicious you look. Over-explaining or contradicting yourself raises it.",
      privacy: "How much of your private life stays protected. Consenting to searches lowers it.",
      leverage: "Your bargaining position. Hard proof and written records build it.",
      risk: "Your legal exposure. Provoking or ignoring deadlines raises it fast.",
      standing: "How well your rights hold up. Asserting them calmly strengthens it.",
    };
    return (
      <div style={{ minHeight: '100vh', background: '#06080D', display: 'flex', flexDirection: 'column' }}>
        <div style={{ padding: '12px 24px', display: 'flex', alignItems: 'center', gap: 16, borderBottom: '1px solid var(--ink-800)' }}>
          <button className="btn btn-ghost" style={{ padding: '7px 14px', fontSize: 13 }} onClick={() => go('map')}>← Exit</button>
          <span style={{ fontWeight: 600, color: 'var(--paper)' }}>{scenario.title}</span>
        </div>
        <div className="fade-in" style={{ flex: 1, overflowY: 'auto', padding: '36px 20px' }}>
          <div style={{ maxWidth: 620, margin: '0 auto' }}>
            <div className="eyebrow" style={{ marginBottom: 10, color: scenario.accent }}>Before you begin</div>
            <h1 className="display" style={{ fontSize: 32, color: 'var(--paper)', marginBottom: 8 }}>{scenario.title}</h1>
            <p style={{ color: 'var(--slate-400)', fontSize: 15.5, marginBottom: 30 }}>Here's the legal background behind this story. It's context to understand the situation \u2014 the right moves are yours to figure out.</p>

            {/* LAWS — easy-to-remember rules */}
            <div style={{ marginBottom: 14 }}>
              <h2 className="display" style={{ fontSize: 22, color: 'var(--paper)', marginBottom: 4, display: 'flex', alignItems: 'center', gap: 8 }}>
                <span>⚖️</span> Laws You'll Learn
              </h2>
              <p style={{ fontSize: 13.5, color: 'var(--slate-400)', margin: 0 }}>The rules behind this story, in plain language.</p>
            </div>
            <div style={{ marginBottom: 34 }}>
              {scenario.brief.map((b, i) => (
                <div key={i} className="card" style={{ padding: '16px 18px', marginBottom: 12, display: 'flex', gap: 14, alignItems: 'flex-start', borderLeft: `4px solid ${scenario.accent}` }}>
                  <div style={{ width: 28, height: 28, flexShrink: 0, borderRadius: '50%', background: `${scenario.accent}22`, color: scenario.accent, display: 'grid', placeItems: 'center', fontWeight: 700, fontSize: 14 }}>{i + 1}</div>
                  <div>
                    <p style={{ fontSize: 16, color: 'var(--paper)', lineHeight: 1.5, margin: 0, fontWeight: 500 }}>{b.rule}</p>
                    {LAWS[b.law] && <button onClick={() => setDrawerLaw(b.law)} className="pill pill-blue" style={{ marginTop: 8, cursor: 'pointer', fontFamily: 'inherit' }}>{LAWS[b.law].statute}</button>}
                  </div>
                </div>
              ))}
            </div>

            {/* METER LEGEND — what the bars mean */}
            <div style={{ marginBottom: 6 }}>
              <h2 className="display" style={{ fontSize: 22, color: 'var(--paper)', marginBottom: 4, display: 'flex', alignItems: 'center', gap: 8 }}>
                <span>📊</span> What the Meters Mean
              </h2>
            </div>
            <p style={{ color: 'var(--slate-400)', fontSize: 14, marginBottom: 16 }}>Your choices move these in real time. A green flash means a smart move, yellow means you wasted an advantage, red means trouble.</p>
            <div style={{ marginBottom: 30 }}>
              {meterCfg.map(m => (
                <div key={m.key} className="card" style={{ padding: '14px 16px', marginBottom: 10, display: 'flex', gap: 14, alignItems: 'center' }}>
                  <span style={{ fontSize: 22, flexShrink: 0 }}>{m.icon}</span>
                  <div style={{ flex: 1 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}>
                      <span style={{ fontWeight: 600, color: 'var(--paper)', fontSize: 15 }}>{m.label}</span>
                      {/* mini sample bar */}
                      <span style={{ flex: 1, height: 7, background: 'var(--ink-700)', borderRadius: 4, overflow: 'hidden', maxWidth: 120 }}>
                        <span style={{ display: 'block', height: '100%', width: '62%', background: m.color, borderRadius: 4 }} />
                      </span>
                    </div>
                    <p style={{ fontSize: 13.5, color: 'var(--slate-400)', margin: 0, lineHeight: 1.45 }}>{meterBlurb[m.key] || 'Tracks how this part of the encounter is going.'}</p>
                  </div>
                </div>
              ))}
            </div>

            {/* flash legend */}
            <div className="card" style={{ padding: '14px 16px', marginBottom: 30, display: 'flex', justifyContent: 'space-around', gap: 10, flexWrap: 'wrap' }}>
              {[['#2BA565','Green','Smart move'],['#D9A406','Yellow','Wasted edge'],['#E2484A','Red','Trouble']].map(([c,t,d],i)=>(

            </button>
          </div>
        </div>
        {drawerLaw && <LawDrawer lawId={drawerLaw} onClose={() => setDrawerLaw(null)} />}
      </div>
    );
  }

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', background: '#06080D', position: 'relative' }}>
      {/* Mid-story exit confirmation */}
      {confirmExit && (
        <div className="fade-in" style={{ position: 'fixed', inset: 0, zIndex: 100, background: 'rgba(6,8,13,0.82)', backdropFilter: 'blur(4px)', display: 'grid', placeItems: 'center', padding: 20 }}>
          <div className="card" style={{ maxWidth: 420, width: '100%', padding: 26, textAlign: 'center' }}>
            <div style={{ fontSize: 34, marginBottom: 12 }}>🚪</div>
            <h3 className="display" style={{ fontSize: 22, color: 'var(--paper)', marginBottom: 8 }}>Leave this story?</h3>
            <p style={{ color: 'var(--slate-400)', fontSize: 15, lineHeight: 1.55, marginBottom: 22 }}>You're in the middle of the scenario. If you leave now, your progress in this story won't be saved and you'll start over next time.</p>
            <div style={{ display: 'flex', gap: 10 }}>
              <button className="btn btn-ghost" style={{ flex: 1, justifyContent: 'center' }} onClick={() => setConfirmExit(false)}>Keep playing</button>
              <button className="btn btn-primary" style={{ flex: 1, justifyContent: 'center', background: 'var(--tension)', borderColor: 'var(--tension)' }} onClick={() => { setConfirmExit(false); go('map'); }}>Leave story</button>
            </div>
          </div>
        </div>
      )}
      {/* HUD bar — wraps on narrow/vertical screens so nothing spills out */}
      <div style={{ padding: '10px 16px', display: 'flex', alignItems: 'center', gap: 12, borderBottom: '1px solid var(--ink-800)', background: 'rgba(6,8,13,0.9)', zIndex: 40, flexWrap: 'wrap', maxWidth: '100%', boxSizing: 'border-box' }}>
        <button className="btn btn-ghost" style={{ padding: '7px 12px', fontSize: 13, flexShrink: 0 }} onClick={() => ending ? go('map') : setConfirmExit(true)}>← Exit</button>
        <div className="pill pill-gold" style={{ flexShrink: 0, marginLeft: 'auto' }}>+{xp} XP</div>
        <div style={{ flexBasis: '100%', display: 'flex', gap: 12, flexWrap: 'wrap', minWidth: 0 }}>
          {meterCfg.map(m => (
            <div key={m.key} style={{ flex: '1 1 auto', minWidth: 92 }}>
              <Meter label={m.label} icon={m.icon} value={meters[m.key] || 0}
                flash={meterFlash[m.key]}
                color={(m.hot && (meters[m.key]||0) > 6) ? m.hot : m.color} />

          ))}

      </div>

      {/* STAGE — scene backdrop + character(s) */}
      <div style={{ position: 'relative', flex: '0 0 auto', height: 'min(46vh, 360px)', overflow: 'hidden' }}>
        <SceneBackdrop scene={stageScene} tension={flash === 'bad' ? 10 : intensity} />
        {!endingData && <SceneProp scenarioId={scenarioId} tension={flash === 'bad' ? 10 : intensity} />}
        {/* shake wrapper — hard on a bad flash, gentle when hot */}
        <div style={{ position: 'absolute', inset: 0, animation: flash === 'bad' ? 'shakeHard 0.5s ease-in-out 2' : (tensionHigh ? 'shake 4s ease-in-out infinite' : 'none') }}>

            <div key={sc.id + idx + runKey}
              style={{ position: 'absolute', bottom: -10,

            </div>

          <div className="fade-in card" style={{ padding: 24, borderColor: consequence.bad ? 'rgba(226,72,74,0.5)' : 'rgba(217,164,6,0.35)', background: consequence.bad ? 'rgba(226,72,74,0.06)' : 'rgba(24,29,42,0.6)' }}>
            <div className="eyebrow" style={{ marginBottom: 10, color: consequence.bad ? 'var(--tension-soft)' : 'var(--gold-400)' }}>
              {consequence.bad ? '⚠ That was the wrong move' : '⚖ What this means'}
            </div>
            <p style={{ fontSize: 16.5, color: 'var(--slate-200)', lineHeight: 1.65, marginBottom: 16 }}>{consequence.consequence}</p>
            {consequence.laws?.length > 0 && (
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 18 }}>
                {consequence.laws.map(lid => <button key={lid} onClick={() => setDrawerLaw(lid)} className="pill pill-blue" style={{ cursor:'pointer', fontFamily:'inherit' }}>{LAWS[lid].statute}</button>)}

        ) : (
          <div>
            {node.speaker && (
              <div className="eyebrow" style={{ marginBottom: 12, color: tensionHigh ? 'var(--tension-soft)' : 'var(--gold-400)' }}>{node.speaker}</div>

            <p style={{ fontSize: node.type === 'dialogue' ? 22 : 18.5, color: 'var(--paper)', lineHeight: 1.55, fontFamily: node.type === 'dialogue' ? 'var(--serif)' : 'var(--sans)', minHeight: 60, marginBottom: 0 }}>

              <p style={{ fontSize: 12, color: 'var(--ink-500)', marginTop: 14 }}>tap to skip</p>

              <div className="fade-up-stagger" style={{ marginTop: 24 }}>

                  <div className="pill pill-tension" style={{ marginBottom: 14 }}>⚖ Watch carefully — this is a real tactic</div>

                    style={{ display:'block', width:'100%', textAlign:'left', padding:'15px 18px', marginBottom:11, cursor:'pointer', fontFamily:'inherit', fontSize:15.5, color:'var(--slate-200)', animation:`riseIn 0.5s ease both`, animationDelay:`${i*0.09}s`, transition:'transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease' }}
                    onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--blue-500)';e.currentTarget.style.background='rgba(59,110,232,0.08)';e.currentTarget.style.transform='translateX(5px)';e.currentTarget.style.boxShadow='0 4px 18px rgba(59,110,232,0.18)';}}
                    onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--ink-700)';e.currentTarget.style.background='rgba(24,29,42,0.6)';e.currentTarget.style.transform='none';e.currentTarget.style.boxShadow='none';}}>
                    <span className="mono" style={{ color:'var(--slate-400)', marginRight:11, fontSize:13 }}>{String.fromCharCode(65+i)}</span>{c.text}
                  </button>
                ))}
              </div>
            )}
            {choicesIn && node.type !== 'choice' && node.type !== 'trap' && (
              <button className="btn btn-primary fade-in" style={{ marginTop: 22, padding: '13px 28px' }} onClick={() => advance(node.next)}>Continue →</button>
            )}
          </div>
        )}
      </div>
      {drawerLaw && <LawDrawer lawId={drawerLaw} onClose={() => setDrawerLaw(null)} />}
    </div>
  );
}

function EndingPanel({ endingData, typed, xp, choicesIn, onClaim, onRetry, setDrawerLaw }) {
  const poor = endingData.type === 'poor';
  const ideal = endingData.type === 'ideal';
  const tone = { ideal:'var(--xp-400)', neutral:'var(--gold-400)', poor:'var(--tension-soft)' }[endingData.type];
  // animated XP count-up once the panel resolves
  const [shownXp, setShownXp] = useState(0);
  useEffect(() => {
    if (!choicesIn || poor) { setShownXp(xp); return; }
    let raf, start = null; const dur = 900;
    const tick = (t) => { if (start === null) start = t; const p = Math.min(1, (t - start) / dur);
      setShownXp(Math.round(xp * (1 - Math.pow(1 - p, 3)))); if (p < 1) raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick); return () => cancelAnimationFrame(raf);
  }, [choicesIn, xp, poor]);

  return (
    <div className="fade-in" style={{ position: 'relative' }}>
      {/* ideal-outcome celebratory sparkle burst */}
      {ideal && choicesIn && (
        <div style={{ position: 'absolute', top: 30, left: 0, right: 0, height: 0, pointerEvents: 'none' }}>
          {Array.from({ length: 18 }).map((_, i) => {
            const ang = (i / 18) * Math.PI * 2, dist = 90 + (i % 4) * 34;
            const col = ['var(--xp-500)','var(--gold-500)','#7DE0A8','#CFE8FF'][i % 4];
            return <span key={i} style={{ position:'absolute', left:'50%', top:0, width:i%2?7:5, height:i%2?7:5,
              borderRadius:i%3?'50%':1, background:col, ['--dx']:`${Math.cos(ang)*dist}px`, ['--dy']:`${Math.sin(ang)*dist}px`,
              animation:'confettiBurst 1.4s ease-out forwards', animationDelay:`${(i%6)*0.05}s`, opacity:0 }} />;
          })}
        </div>
      )}
      <div className="eyebrow" style={{ color: tone, marginBottom: 10 }}>
        {ideal ? '★ Ideal outcome' : endingData.type === 'neutral' ? '◆ Outcome' : '✕ This didn\u2019t go well'}
      </div>
      <h1 className="display" style={{ fontSize: 32, color: poor ? 'var(--tension-soft)' : 'var(--paper)', marginBottom: 14,
        textShadow: ideal ? '0 0 30px rgba(78,217,139,0.4)' : 'none' }}>{endingData.title}</h1>
      <p style={{ fontSize: 17, color: 'var(--slate-300)', lineHeight: 1.6, marginBottom: 22, minHeight: 50 }}>{typed}</p>
      {choicesIn && (
        <div className="fade-in">
          <div className="card" style={{ padding: 22, marginBottom: 22, borderColor: poor ? 'rgba(226,72,74,0.35)' : 'rgba(217,164,6,0.3)', position: 'relative', overflow: 'hidden' }}>
            <div style={{ position:'absolute', top:0, left:0, right:0, height:3, background:`linear-gradient(90deg, transparent, ${tone}, transparent)` }} />
            <div className="eyebrow" style={{ marginBottom: 10 }}>⚖ What this teaches</div>
            <p style={{ color: 'var(--slate-200)', lineHeight: 1.65, marginBottom: 16 }}>{endingData.insight}</p>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
              {endingData.laws.map(lid => <button key={lid} onClick={() => setDrawerLaw(lid)} className="pill pill-blue" style={{ cursor:'pointer', fontFamily:'inherit' }}>{LAWS[lid].statute}</button>)}
            </div>
          </div>
          {!poor && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 22 }}>
              <span className="display" style={{ fontSize: 36, color: 'var(--xp-400)', animation: ideal ? 'meterPop 0.5s ease' : 'none' }}>+{shownXp}</span>
              <span style={{ color: 'var(--slate-400)', fontWeight: 600 }}>XP earned</span>
              {endingData.mult !== 1 && <span className="pill pill-gold" style={{ animation: 'popIn 0.4s ease 0.5s both' }}>×{endingData.mult} bonus</span>}
            </div>
          )}
          {poor ? (
            <div>
              <p style={{ color: 'var(--slate-400)', fontSize: 14, marginBottom: 14 }}>Aim for the ideal outcome. Review what went wrong above, then try again.</p>
              <div style={{ display: 'flex', gap: 12 }}>
                <button className="btn btn-primary" onClick={onRetry}>↻ Try again</button>
                <button className="btn btn-ghost" onClick={onClaim}>Give up & exit</button>
              </div>
            </div>
          ) : (
            <div style={{ display: 'flex', gap: 12 }}>
              <button className="btn btn-primary" onClick={onClaim}>Claim & continue →</button>
              <button className="btn btn-ghost" onClick={onRetry}>↻ Replay</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ════════════════════════════════════════════════════════════
//  XP helper (mirrors packages/gamification XPEngine)
// ════════════════════════════════════════════════════════════
function xpForLevel(lvl) { return lvl < 1 ? 0 : Math.floor(100 * Math.pow(lvl, 1.5)); }
function levelForXP(xp) { let l = 1, acc = 0; while (acc + xpForLevel(l) <= xp) { acc += xpForLevel(l); l++; } return l; }
function XPProgress(xp) {
  const level = levelForXP(xp);
  let acc = 0; for (let i = 1; i < level; i++) acc += xpForLevel(i);
  const required = xpForLevel(level);
  const current = xp - acc;
  return { level, current, required, percent: Math.min(100, Math.floor((current / required) * 100)) };
}

// ════════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════════
const initialState = {
  onboarded: false,
  characterCreated: false,
  jurisdiction: null,
  xp: 0,
  streak: 1,
  isPro: false,      // premium status (toggle in this prototype)
  look: { ...DEFAULT_LOOK },
  completed: {},     // scenarioId -> endingType (any ending reached)
  mastered: {},      // scenarioId -> true (ideal ending; unlocks next story)
  saved: [],         // saved law ids
  achievements: [],  // earned achievement ids
};

function reducer(state, action) {
  switch (action.type) {
    case 'SET_LOOK':
      return { ...state, look: action.look };
    case 'CREATE_CHARACTER':
      return { ...state, look: action.look, characterCreated: true };
    case 'TOGGLE_PRO': {
      const becomingPro = !state.isPro;
      return { ...state, isPro: !state.isPro, justUnlockedPro: becomingPro };
    }
    case 'CLEAR_PRO_CELEBRATION':
      return { ...state, justUnlockedPro: false };
    case 'ONBOARD':
      return { ...state, onboarded: true, jurisdiction: action.jurisdiction };
    case 'COMPLETE_SCENARIO': {
      const isIdeal = action.endingType === 'ideal';
      const completed = { ...state.completed, [action.scenarioId]: action.endingType };
      // mastered = reached the ideal ending; this is what unlocks progression
      const mastered = { ...(state.mastered || {}) };
      if (isIdeal) mastered[action.scenarioId] = true;
      const newAch = [...state.achievements];
      if (!newAch.includes('first-steps')) newAch.push('first-steps');
      if (isIdeal && !newAch.includes('rights-scholar')) newAch.push('rights-scholar');
      if (state.streak >= 3 && !newAch.includes('streak-3')) newAch.push('streak-3');
      // XP is only awarded for reaching the ideal outcome
      const xpGain = isIdeal ? action.xp : 0;
      return { ...state, xp: state.xp + xpGain, completed, mastered, achievements: newAch };
    }
    case 'TOGGLE_SAVE': {
      const saved = state.saved.includes(action.id)
        ? state.saved.filter(x => x !== action.id)
        : [...state.saved, action.id];
      const newAch = [...state.achievements];
      if (saved.length >= 3 && !newAch.includes('explorer')) newAch.push('explorer');
      return { ...state, saved, achievements: newAch };
    }
    default:
      return state;
  }
}

function Shell({ state, dispatch, route, setRoute }) {
  const prog = XPProgress(state.xp);
  const jurName = JURISDICTIONS.find(j => j.code === state.jurisdiction)?.name || '';
  const go = (view, param) => setRoute({ view, param });

  const nav = [
    { id: 'dashboard', label: 'Home', icon: Icons.home },
    { id: 'map', label: 'Scenarios', icon: Icons.map },
    { id: 'ai', label: 'Ask Brennan', icon: Icons.ai, pro: true },
    { id: 'laws', label: 'Law Explorer', icon: Icons.book, pro: true },
    { id: 'achievements', label: 'Achievements', icon: Icons.trophy },
    { id: 'customize', label: 'Customize', icon: Icons.user },
  ];

  // Player is fullscreen (no shell chrome)
  if (route.view === 'play') {
    return <ErrorBoundary><CinePlayer scenarioId={route.param} state={state} dispatch={dispatch} go={go} /></ErrorBoundary>;
  }

  return (
    <div className="app-shell">
      {state.justUnlockedPro && <ProCelebration state={state} dispatch={dispatch} />}
      <aside className="sidebar">
        <div className="brand">
          <div className="brand-mark">B</div>
          <div className="brand-name">Brennan</div>
        </div>
        <nav>
          {nav.map(n => (
            <button key={n.id} className={`nav-item ${route.view === n.id ? 'active' : ''}`} onClick={() => go(n.id)}>
              {n.icon}<span>{n.label}</span>
              {n.pro && !state.isPro && <span style={{ marginLeft: 'auto', fontSize: 11 }} title="Brennan Pro">🔒</span>}
            </button>
          ))}
        </nav>
        <div className="sidebar-foot">
          <div className="streak-card">
            <div className="streak-flame">
              <span className="flame-icon">🔥</span>
              <div>
                <div className="streak-count">{state.streak}</div>
                <div className="streak-label">day streak</div>
              </div>
            </div>
            <div className="xp-bar-wrap">
              <div className="xp-bar-head">
                <span style={{ color: 'var(--slate-300)', fontWeight: 600 }}>Level {prog.level}</span>
                <span style={{ color: 'var(--slate-400)' }}>{prog.current}/{prog.required}</span>
              </div>
              <div className="xp-bar-track"><div className="xp-bar-fill" style={{ width: `${prog.percent}%` }} /></div>
            </div>
          </div>
        </div>
      </aside>

      <div className="main-area">
        <header className="topbar">
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <span className="pill pill-blue">{jurName}</span>
            <span style={{ fontSize: 13, color: 'var(--slate-400)' }}>{state.jurisdiction}</span>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
            <span className="pill pill-gold">{state.xp.toLocaleString()} XP</span>
            <div style={{ width: 34, height: 34, borderRadius: '50%', background: 'linear-gradient(135deg,var(--blue-500),var(--gold-500))', display: 'grid', placeItems: 'center', fontWeight: 700, color: '#fff', fontSize: 14 }}>You</div>
          </div>
        </header>
        <main className="content">
          {route.view === 'dashboard' && <Dashboard state={state} go={go} />}
          {route.view === 'map' && <ScenarioMap state={state} go={go} />}
          {route.view === 'ai' && (state.isPro ? <AIAssistant state={state} go={go} /> : <ProGate feature="Ask Brennan" desc="Get instant, plain-English answers about your rights from Brennan's AI guide — with a built-in safety layer that never gives legal advice it shouldn't." dispatch={dispatch} go={go} />)}
          {route.view === 'laws' && (state.isPro ? <LawExplorer state={state} dispatch={dispatch} go={go} /> : <ProGate feature="Law Explorer" desc="Browse the full library of statutes and constitutional provisions behind every scenario, searchable and explained in plain language." dispatch={dispatch} go={go} />)}
          {route.view === 'achievements' && <Achievements state={state} go={go} />}
          {route.view === 'customize' && <CharacterCreator state={state} dispatch={dispatch} editMode
            onDone={(look) => { dispatch({ type: 'SET_LOOK', look }); go('dashboard'); }} />}
        </main>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
//  APP ROOT
// ════════════════════════════════════════════════════════════
// ════════════════════════════════════════════════════════════
//  ERROR BOUNDARY — never let one bad render black out the app
// ════════════════════════════════════════════════════════════
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error('Render error:', error, info); }
  render() {
    if (this.state.error) {
      return (
        <div style={{ minHeight: '100vh', display: 'grid', placeItems: 'center', padding: 32, textAlign: 'center' }}>
          <div className="card" style={{ padding: 32, maxWidth: 520 }}>
            <div style={{ fontSize: 40, marginBottom: 16 }}>⚠️</div>
            <h2 className="display" style={{ fontSize: 24, color: 'var(--paper)', marginBottom: 12 }}>Something hit a snag</h2>
            <p style={{ color: 'var(--slate-400)', marginBottom: 20 }}>The scene couldn't render. This is a prototype bug, not your fault.</p>
            <pre className="mono" style={{ fontSize: 11, color: 'var(--tension-soft)', background: 'var(--ink-850)', padding: 14, borderRadius: 8, textAlign: 'left', overflow: 'auto', marginBottom: 20 }}>
              {String(this.state.error && this.state.error.message)}
            </pre>
            <button className="btn btn-primary" onClick={() => this.setState({ error: null })}>Try again</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function App() {
  const [state, dispatch] = React.useReducer(reducer, initialState);
  const [route, setRoute] = useState({ view: 'dashboard', param: null });

  if (!state.onboarded) {
    return <Onboarding onComplete={(jur) => dispatch({ type: 'ONBOARD', jurisdiction: jur })} />;
  }
  if (!state.characterCreated) {
    return <CharacterCreator state={state} dispatch={dispatch}
      onDone={(look) => dispatch({ type: 'CREATE_CHARACTER', look })} />;
  }
  return <Shell state={state} dispatch={dispatch} route={route} setRoute={setRoute} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
