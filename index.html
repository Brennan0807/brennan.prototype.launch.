      TRAP_STEPOUT_FALL: {
        type: 'dialogue', scene: 'night_street', char: 'reyes', emotion: 'angry', speaker: 'Officer Park', stress: true,
        content: "\"Refusing a lawful order \u2014 step out, now.\" He opens your door. What was a warning for a brake light is now you being pulled from the car for resisting. You picked the one fight the law doesn't back.",
        next: 'END_RESIST',
      },
      // ── The dog-sniff: the heart of Rodriguez. Subtle prolong vs. consent. ──
      CHOICE_SNIFF: {
        type: 'dialogue', scene: 'night_street', char: 'reyes', emotion: 'suspicious', speaker: 'Officer Park',
        content: "You stand on the shoulder. He glances at his radio. \"I've got a K-9 unit a few minutes out. I'd like to walk a dog around the car. You can wait \u2014 won't take long.\" He hasn't said you're under arrest. The warning was issued five minutes ago.",
        next: 'TRAP_DOG',

      TRAP_DOG: {
        type: 'trap', scene: 'night_street', char: 'reyes', emotion: 'suspicious',
        prompt: "He wants to hold you for a drug dog. How do you respond?",
        choices: [
          { text: "\"Sure, I've got nothing to hide. I'll wait for the dog.\"", trap: true, to: 'TRAP_DOG_FALL', tier: 'bad' },
          { text: "\"I guess that's fine, if it's quick.\"", trap: true, to: 'TRAP_DOG_FALL', tier: 'bad' },
          { text: "\"You've issued the warning. Am I being detained, or am I free to go?\"", to: 'CHOICE_PRESS', tier: 'good',
            xp: 35, meters: { clock: -2, suspicion: -1 } },

        trapReveal: {
          title: "You agreed to be held.",
          body: "This is the exact situation in Rodriguez v. United States (2015). Once the stop's mission \u2014 the warning \u2014 was done, the officer needed reasonable suspicion to hold you any longer. By agreeing to wait for the dog, you consented to the very prolonging the Constitution would otherwise forbid.",
          example: "Example: \u201CSure, I'll wait\u201D converts an unlawful extension into a voluntary one. The seven or eight minutes for a dog to arrive is exactly what the Supreme Court said police can't make you do without suspicion \u2014 unless you say yes.",
          disclaimer: "Heads up: 'I've got nothing to hide' is how people talk themselves into searches they could have walked away from. Consent erases the protection.",
          laws: ['US-RODRIGUEZ-2015','US-CONST-AM4'],

          body: "Under Rodriguez v. United States (2015), once the warning was issued the officer couldn't extend the stop to wait for a dog without reasonable suspicion. Asking \u201Cam I being detained, or free to go?\u201D forces him to either justify holding you or release you \u2014 he can't just stall.",
          example: "What could have happened: agreeing to 'wait for the dog' would have made the delay legal by consent. Instead you put the burden back where it belongs \u2014 on the officer to show a reason.",
          disclaimer: "Heads up: a dog sniff is not part of a traffic stop. The clock matters: once the mission's done, every extra minute needs its own justification.",
          laws: ['US-RODRIGUEZ-2015','US-CONST-AM4'],

      TRAP_DOG_FALL: {
        type: 'narration', scene: 'night_street', char: null, stress: true,
        content: "You wait. Minutes pass on the cold shoulder. The dog arrives, circles the car, and 'alerts' near the passenger door. Now there's probable cause to search \u2014 built entirely on the time you volunteered to give him.",

      // ── He pushes back. The Rodriguez line under pressure. ──
      CHOICE_PRESS: {
        type: 'dialogue', scene: 'night_street', char: 'reyes', emotion: 'defensive', speaker: 'Officer Park',
        content: "\"I didn't say you were free to go.\" He's not answering the question \u2014 he's testing whether you'll fold. The clock is the whole game now: he wants you to wait without making it an official detention he has to justify.",
        next: 'CHOICE_FINAL',

      CHOICE_FINAL: {
        type: 'choice', scene: 'night_street', char: 'reyes', emotion: 'defensive',
        prompt: "He's stalling, hoping you'll just wait. What's your move?",
        choices: [
          { text: "\"Then I'm being detained. I don't consent to any search, and I want that noted. Are you holding me?\"", to: 'END_CLEAN', tier: 'good',
            consequence: "Textbook under pressure. You refuse to let an unofficial 'just wait' substitute for a justified detention, decline consent, and make him commit. With only a brake light and no reasonable suspicion, he has nothing to hold you on (Rodriguez v. United States).", laws: ['US-RODRIGUEZ-2015','US-CONST-AM4'], xp: 35, meters: { clock: -2, trust: +1 } },
          { text: "Say nothing and just wait \u2014 you don't want to seem difficult.", to: 'END_WAITED', tier: 'medium',
            consequence: "Silence here works against you. By waiting quietly, you let him stretch the stop indefinitely without ever justifying it \u2014 the passive cooperation Rodriguez warns about. You needed to force the question, not wait it out.", laws: ['US-RODRIGUEZ-2015'], xp: 8, meters: { clock: +3 } },
          { text: "\"This is harassment and I'll have your badge for it.\"", to: 'END_RESIST', tier: 'bad',
            consequence: "Threatening him abandons the one position that was working \u2014 calm legal pressure \u2014 and hands him the 'escalation' he can act on. You were winning on the law; you traded it for a fight.", laws: [], xp: 0, meters: { tension: +4, suspicion: +2 } },
        ],

    },
    endings: {
      END_CLEAN: { type: 'ideal', scene: 'ending_calm', char: 'driver', emotion: 'confident', speaker: 'You', title: 'You ran out his clock', dualEnd: { scene: 'ending_calm', chars: [ { id: 'driver', emotion: 'happy', label: 'You' } ] }, summary: "With nothing to hold you on, he hands it back. \"...Get the light fixed.\" You drive off with a warning and nothing else \u2014 no search, no dog, no extra time you didn't owe.", insight: "Rodriguez v. United States (2015): a stop ends when its mission ends. Holding you for a dog sniff without reasonable suspicion is an unlawful seizure. The hard part isn't knowing the rule \u2014 it's recognizing the exact moment the lawful stop is over and calmly forcing the question. You also correctly complied with the lawful order to step out (Mimms) without consenting to anything more.", laws: ['US-RODRIGUEZ-2015','US-MIMMS-1977','US-CONST-AM4'], mult: 1.6 },
      END_WAITED: { type: 'neutral', scene: 'night_street', char: 'reyes', emotion: 'confident', speaker: 'Officer Park', title: 'You waited it out', summary: "Eventually he lets you go \u2014 no dog ever came. But you spent twenty extra minutes on the shoulder you never had to give, because you never made him justify holding you.", insight: "Passive waiting is how an unlawful prolonging becomes routine \u2014 Rodriguez protects you only if you invoke it. You had the right answer available; you just didn't force the question. Try again and make him commit to detaining you or letting you go.", laws: ['US-RODRIGUEZ-2015'], mult: 1.0 },
      END_DOG_SEARCH: { type: 'poor', scene: 'ending_court', char: null, title: 'The dog you invited', dualEnd: { scene: 'ending_court', chars: [ { id: 'driver', emotion: 'nervous', sweat: 'heavy', label: 'You' } ] }, summary: "The search tears through your car on the roadside. Whether or not they find anything, you consented to a detention the Constitution would have spared you \u2014 and made the whole thing legal by saying yes.", insight: "Rodriguez v. United States (2015) means police can't extend a finished stop for a dog sniff without reasonable suspicion \u2014 but consent waives that. 'Sure, I'll wait' is the trap. Try again and refuse to volunteer the time.", laws: ['US-RODRIGUEZ-2015','US-CONST-AM4'], mult: 0.3 },
      END_RESIST: { type: 'poor', scene: 'jail', char: null, title: "The fight you didn't have to take", dualEnd: { scene: 'jail', chars: [ { id: 'driver', emotion: 'nervous', sweat: 'heavy', label: 'You' } ] }, summary: "Whether you refused to step out or threatened him, you gave him the one thing he lacked: a reason. A brake-light warning ends with you in cuffs over conduct that had nothing to do with the stop.", insight: "Two different mistakes lead here: refusing a lawful order to exit (Pennsylvania v. Mimms) and escalating with threats. Both hand the officer grounds he didn't have. The winning posture is calm and precise \u2014 comply with what's lawful, refuse what's optional, and never give him the confrontation. Try again.", laws: ['US-MIMMS-1977','US-CONST-AM4'], mult: 0.2 },
    },
  },

      KT_QUESTIONS: {
        type: 'dialogue', scene: 'apartment_door', char: 'officer2', emotion: 'suspicious', speaker: 'Det. Hale',
        content: "\"Where were you around eight? Anybody with you? Mind if we just step in to check a couple things?\" The questions tighten, and he keeps circling back to getting inside.",
        next: 'KT_PRESSURE',
      },
      KT_PRESSURE: {
        type: 'choice', scene: 'apartment_door', char: 'officer2', emotion: 'defensive',
        prompt: "He's pushing to come in or keep you talking. How do you end this?",
        choices: [
          { text: "\"No warrant, so we're done. Goodnight.\"", to: 'END_HELD_LINE', tier: 'good',
            consequence: "Clean close. You can end a friendly chat anytime. No warrant, no permission, no emergency \u2014 they have no way in, and you said it without escalating.", laws: ['US-KING-2011','US-CONST-AM4','US-CONST-AM5'], xp: 40, meters: { privacy: 2, composure: 2 } },
          { text: "Keep answering everything as helpfully as you can, hoping that satisfies them and they leave.", to: 'END_TALKED_KT', tier: 'medium',
            consequence: "Cooperating rarely makes a determined investigator leave \u2014 it just gives them more. Every answer is a thread to pull.", laws: ['US-CONST-AM5'], xp: 8, meters: { suspicion: 2, exposure: 2 } },
          { text: "\"Get off my property!\" Step toward him.", to: 'END_ARREST_KT', tier: 'bad',
            consequence: "You had every advantage \u2014 and threatening him while stepping forward hands him a reason to arrest you that the knock never gave him.", laws: [], xp: 0, meters: { exposure: 5, composure: -3 } },
        ],
      },
    },
    endings: {
      END_HELD_LINE: { type: 'ideal', scene: 'ending_calm', char: 'you', emotion: 'confident', speaker: 'You', title: 'The door stayed closed', dualEnd: { scene: 'ending_calm', chars: [ { id: 'you', emotion: 'confident', label: 'You' } ] }, summary: "They linger, then leave \u2014 because without a warrant, your permission, or an emergency, there was nothing else they could do. Your home stayed yours.", insight: "Everything about a knock-and-talk is built to make you feel you should cooperate. The law is the opposite: your doorstep is your home, they need your yes or an emergency to cross it, and opening up or 'just answering' can give it away. Stay calm, keep the door, say no.", laws: ['US-JARDINES-2013','US-KING-2011','US-CONST-AM4','US-CONST-AM5'], mult: 1.7 },
      END_TALKED_KT: { type: 'neutral', scene: 'apartment_door', char: 'officer2', emotion: 'confident', speaker: 'Det. Hale', title: 'You talked too long', summary: "They eventually go \u2014 but only after you answered far more than you owed, with an officer cataloguing your yard. No arrest, but you gave up ground.", insight: "A knock-and-talk only works on people who keep engaging. You can end it the moment you choose. Try again and close it out.", laws: ['US-KING-2011','US-CONST-AM5'], mult: 1.0 },
      END_CONSENTED: { type: 'poor', scene: 'ending_court', char: null, title: 'You let them in', dualEnd: { scene: 'ending_court', chars: [ { id: 'you', emotion: 'nervous', sweat: 'heavy', label: 'You' } ] }, summary: "Once inside, what they could see did the rest. It traces back to one move: you let them in when you never had to.", insight: "Saying 'come in' \u2014 or 'sure, look' \u2014 throws away the warrant rule, and anything they spot becomes evidence. Try again and keep the door.", laws: ['US-KING-2011','US-CONST-AM4'], mult: 0.3 },
      END_ARREST_KT: { type: 'poor', scene: 'jail', char: null, title: 'You handed him the reason', dualEnd: { scene: 'jail', chars: [ { id: 'you', emotion: 'nervous', sweat: 'heavy', label: 'You' } ] }, summary: "Threatening him and stepping forward gave him exactly what a knock never did: a reason to arrest you.", insight: "You can refuse, stay quiet, and shut the door \u2014 all fine. A threat or a lunge is its own crime. Assert yourself with calm words and a closed door, never a confrontation. Try again.", laws: ['US-CONST-AM4'], mult: 0.2 },
    },
  },

  // ════════════════════════════════════════════════════════════

      { key: 'credibility', label: 'Credibility', icon: '\uD83C\uDF96\uFE0F', color: 'var(--blue-400)' },

    nodes: {

        type: 'dialogue', scene: 'office', char: 'manager', emotion: 'suspicious', speaker: 'Rourke',
        content: "He pulls you into an empty conference room and shuts the door. \"Let's talk about your 'attitude' again.\" It's exactly the moment you've wanted on record. Your hand drifts to your phone.",

      REC_CHOICE1: {

            consequence: "The disciplined move. Notes you write are usable and believable. A secret recording of a private talk could be a crime \u2014 the opposite of helpful.", laws: ['CA-PEN-632'], xp: 25, meters: { evidence: 2, credibility: 1 } },
          { text: "Quietly start recording in your pocket \u2014 he'll never know it's happening.", trap: true, to: 'TRAP_SECRET', tier: 'bad' },
          { text: "Ask out loud whether he's okay with you recording the conversation before he begins.", to: 'REC_ASK', tier: 'medium',
            consequence: "Totally legal \u2014 if he says yes, you're fine. But announcing it usually makes people clam up or end the meeting, so you rarely catch anything.", laws: ['CA-PEN-632'], xp: 12, meters: { exposure: -1, tension: 1 } },
        ],

          { text: "Stop \u2014 rely on notes instead.", to: 'REC_HR', tier: 'good', xp: 20, meters: { exposure: -1, evidence: 1 } },

        trapReveal: {

          body: "Secretly recording a private conversation in California can be a crime by itself \u2014 and the recording usually can't even be used. The narrow exception is for something genuinely dangerous, not an 'attitude' talk. You aimed at him and hit yourself.",
          example: "People secretly tape a boss for leverage, then find the clip is useless to them \u2014 but very useful to the other side, who can now come after them for making it.",
          disclaimer: "This is the opposite of filming police in public, which is protected. A private conversation is different.",
          laws: ['CA-PEN-632','CA-PEN-633.5'],

          example: "What you dodged: a recording you couldn't use \u2014 but that could be used against you. Writing it down does the job safely.",
          disclaimer: "The narrow exception is for serious crimes \u2014 not an everyday workplace fight.",
          laws: ['CA-PEN-632','CA-PEN-633.5'],
        },
      },
      TRAP_SECRET_FALL: {
        type: 'narration', scene: 'office', char: null, stress: true,
        content: "You get the whole rant on tape. Feels like a win \u2014 until you try to use it. It can't help your case, and now he's claiming you taped him illegally. The thing you risked everything for is pointing the wrong way.",
        next: 'END_REC_BACKFIRE',

      REC_ASK: {

          { text: "Hand over your notes, his hostile emails, and witness names.", to: 'END_REC_BUILT', tier: 'good',
            consequence: "How you win clean. Notes, his own messages, and witnesses build a believable case \u2014 and nothing you did can be turned against you.", laws: ['CA-PEN-632','CA-LAB-1102'], xp: 35, meters: { evidence: 3, credibility: 2 } },
          { text: "Offer the secret recording you made, insisting it proves absolutely everything he said.", to: 'END_REC_BACKFIRE', tier: 'bad',
            consequence: "Leaning on an illegal tape sinks you \u2014 it can't help, it can hurt, and it makes HR question your judgment instead of his.", laws: ['CA-PEN-632'], xp: 0, meters: { exposure: 3, credibility: -2 } },
          { text: "Insist HR act on your word alone, and threaten to take the whole thing public.", to: 'END_REC_WEAK', tier: 'medium',
            consequence: "Your account matters, but with nothing backing it and a threat attached, HR can stall and call it he-said-she-said. You had real ways to back it up.", laws: ['CA-LAB-1102'], xp: 8, meters: { credibility: -1, tension: 2 } },
        ],
      },
    },
    endings: {
      END_REC_BUILT: { type: 'ideal', scene: 'ending_calm', char: 'worker', emotion: 'confident', speaker: 'You', title: 'A case that holds up', dualEnd: { scene: 'ending_calm', chars: [ { id: 'worker', emotion: 'happy', label: 'You' } ] }, summary: "Notes, his own emails, and two witnesses \u2014 all gathered the right way. HR can't wave it off, and nothing you did can be flipped against you.", insight: "The 'obvious' move \u2014 secretly recording \u2014 is the trap: usually unusable and can get you in trouble. The winning play is the boring one: write it down, keep the messages you're allowed to have, line up witnesses.", laws: ['CA-PEN-632','CA-PEN-633.5','CA-LAB-1102'], mult: 1.6 },
      END_REC_WEAK: { type: 'neutral', scene: 'phone_call', char: 'worker', emotion: 'conflicted', speaker: 'You', title: 'Your word against his', summary: "With nothing to back it up, HR 'logs your complaint' and little changes. You were right \u2014 you just didn't build the case that would force their hand.", insight: "Being right isn't the same as being able to prove it. You had legal ways \u2014 notes, messages, witnesses. Try again and build it.", laws: ['CA-LAB-1102'], mult: 1.0 },
      END_REC_BACKFIRE: { type: 'poor', scene: 'ending_court', char: null, title: 'The tape turned on you', dualEnd: { scene: 'ending_court', chars: [ { id: 'worker', emotion: 'nervous', sweat: 'heavy', label: 'You' } ] }, summary: "The recording can't prove your complaint \u2014 but it can show you broke the law making it. Now the conversation is about you, not him.", insight: "Secretly recording a private conversation can be a crime here and usually can't be used anyway. Try again and get your proof the safe way.", laws: ['CA-PEN-632','CA-PEN-633.5'], mult: 0.3 },

  // ════════════════════════════════════════════════════════════
  //  THE PASSCODE — phone unlock. Lesson: passcode vs face/thumb.
  // ════════════════════════════════════════════════════════════
  'the-passcode': {
    id: 'the-passcode', title: 'The Passcode', accent: '#EC4899',
    entry: 'PC_START', povLabel: 'You (detained)', playerChar: 'you',
    brief: [
      { law: 'US-FISHER-PASSCODE', rule: "A passcode lives in your head \u2014 and courts say they generally can\u2019t force you to say what\u2019s in your head." },
      { law: 'US-BIOMETRIC-SPLIT', rule: "Face and fingerprint unlock are weaker: some courts let police force those. A passcode is the safer lock." },
      { law: 'US-RILEY-2014', rule: "They usually need a warrant to search a phone at all \u2014 unlocking it yourself throws that away." },
    ],
    meterConfig: [
      { key: 'privacy', label: 'Data Shielded', icon: '\uD83D\uDD12', color: 'var(--blue-400)' },
      { key: 'composure', label: 'Composure', icon: '\uD83E\uDDD8', color: 'var(--xp-500)' },
      { key: 'leverage', label: 'Footing', icon: '\u2696\uFE0F', color: 'var(--gold-500)' },
      { key: 'exposure', label: 'Exposure', icon: '\u26A0\uFE0F', color: '#EC4899', hot: 'var(--tension)' },
    ],
    startMeters: { privacy: 6, composure: 5, leverage: 4, exposure: 2 },
    nodes: {
      PC_START: {
        type: 'narration', scene: 'interrogation_room', char: null,
        content: "You've been detained, and your phone sits on the table between you and a detective. Your whole life is on it. It opens two ways \u2014 your face, or a code only you know \u2014 and those two doors are not equal.",
        next: 'PC_ASK',
      },
      PC_ASK: {
        type: 'dialogue', scene: 'interrogation_room', char: 'officer2', emotion: 'suspicious', speaker: 'Det. Cole',
        content: "\"Let's make this easy. Unlock your phone for me. Nothing to hide, no reason not to, right?\" He slides it over. It's set to open with your face.",
        next: 'PC_CHOICE1',
      },
      PC_CHOICE1: {
        type: 'choice', scene: 'interrogation_room', char: 'officer2', emotion: 'suspicious',
        prompt: "He wants it open. What do you do?",
        choices: [
          { text: "\"I'm not unlocking it. Do you have a warrant?\"", to: 'PC_WARRANT', tier: 'good',
            consequence: "Strongest opening. You say no and put it back on them \u2014 they usually need a warrant to search a phone, and you don't have to help them in.", laws: ['US-RILEY-2014','US-CONST-AM4'], xp: 25, meters: { privacy: 1, leverage: 1 } },
          { text: "Pick it up and glance at it to face-unlock, then hand it over so you don't look guilty.", trap: true, to: 'TRAP_BIO', tier: 'bad' },
          { text: "\"My lawyer said never to unlock anything \u2014 take it up with them.\"", to: 'PC_WARRANT', tier: 'medium',
            consequence: "Smart and protective. A touch less precise than flatly refusing, but it firmly shuts the door on helping them \u2014 which is what matters.", laws: ['US-CONST-AM6','US-CONST-AM5'], xp: 14, meters: { leverage: 1 } },
        ],
      },
      TRAP_BIO: {
        type: 'trap', scene: 'interrogation_room', char: 'officer2', emotion: 'suspicious',
        prompt: "You're lifting the phone to your face. Stop \u2014 is this the door you want to open?",
        choices: [
          { text: "Go ahead \u2014 face unlock and hand it over to get this over with.", trap: true, to: 'TRAP_BIO_FALL', tier: 'bad' },
          { text: "Don't \u2014 put it down, refuse.", to: 'PC_WARRANT', tier: 'good', xp: 20, meters: { privacy: 1, composure: 1 } },
        ],
        trapReveal: {
          title: "You opened the one door you didn't have to.",
          body: "Unlocking it yourself is the same as handing them everything \u2014 no warrant needed. And the catch: a face or fingerprint unlock is the weak lock, the one some courts say they can force anyway. The code in your head is the strong one. You skipped your best protection.",
          example: "If you'd left it on a passcode and stayed quiet, they generally couldn't make you say it. Face unlock is the easy door \u2014 opening it yourself gave away even the warrant requirement.",
          disclaimer: "'Nothing to hide' is the oldest lever there is. Refusing to unlock isn't proof of guilt \u2014 it's your right.",
          laws: ['US-BIOMETRIC-SPLIT','US-FISHER-PASSCODE','US-RILEY-2014'],
        },
        surviveReveal: {
          title: "You kept the strong lock shut.",
          body: "Good. Unlocking it yourself hands them everything. By refusing, you push them back to the rules \u2014 where a code in your head is protected, even though a face or fingerprint scan often isn't.",
          example: "What you dodged: giving away your whole phone for free. Make them get a warrant, and lean on a passcode rather than your face.",
          disclaimer: "In a spot like this, a passcode is a safer lock than your face or fingerprint.",
          laws: ['US-FISHER-PASSCODE','US-BIOMETRIC-SPLIT'],
        },
      },
      TRAP_BIO_FALL: {
        type: 'narration', scene: 'interrogation_room', char: null, stress: true,
        content: "It unlocks and you slide it across. He starts scrolling \u2014 messages, photos, everywhere you've been. No warrant needed, because you opened it yourself. There's no taking it back.",
        next: 'END_PC_UNLOCKED',
      },
      PC_WARRANT: {
        type: 'dialogue', scene: 'interrogation_room', char: 'officer2', emotion: 'defensive', speaker: 'Det. Cole',
        content: "\"Fine. I'll just hold it to your face, or press your thumb to it. Don't need your mouth for that.\" He reaches for the phone.",
        next: 'PC_CHOICE2',
      },
      PC_CHOICE2: {
        type: 'choice', scene: 'interrogation_room', char: 'officer2', emotion: 'defensive',
        prompt: "He's threatening to force it open with your face or thumb. Your move?",
        choices: [
          { text: "\"It's on a passcode, and I won't tell you the code.\"", to: 'PC_PRESSURE', tier: 'good',
            consequence: "Exactly the distinction that matters. A code in your head is protected in a way your face isn't. Switching to it and staying quiet is the strong spot.", laws: ['US-FISHER-PASSCODE','US-CONST-AM5'], xp: 40, meters: { privacy: 2, leverage: 2 } },
          { text: "Shrug and let him press your thumb to it \u2014 surely a fingerprint can't really count.", trap: true, to: 'TRAP_BIO_FALL', tier: 'bad',
            consequence: "Your fingerprint is the weak lock \u2014 the one courts are most willing to let them force. Don't volunteer it.", laws: ['US-BIOMETRIC-SPLIT'], xp: 0, meters: { privacy: -3, exposure: 2 } },
          { text: "Say nothing and let him try whatever he wants.", to: 'PC_PRESSURE', tier: 'medium',
            consequence: "Silence protects the code \u2014 good \u2014 but going limp may let him force the weaker face/thumb unlock. Saying it out loud is stronger.", laws: ['US-CONST-AM5'], xp: 10, meters: { exposure: 1 } },
        ],
      },
      PC_PRESSURE: {
        type: 'dialogue', scene: 'interrogation_room', char: 'officer2', emotion: 'angry', speaker: 'Det. Cole', stress: true,
        content: "\"You think you're clever.\" He's frustrated \u2014 because you've landed somewhere solid: no permission, locked with a code, mouth shut. One play left: get you talking about anything.",
        next: 'PC_FINAL',
      },
      PC_FINAL: {
        type: 'choice', scene: 'interrogation_room', char: 'officer2', emotion: 'angry',
        prompt: "He's pushing you to keep talking. How do you finish this?",
        choices: [
          { text: "\"I'm done talking. I want a lawyer.\"", to: 'END_PC_HELD', tier: 'good',
            consequence: "Clean close. Asking for a lawyer ends the questions, and with the phone locked and no permission given, they're stuck getting a warrant \u2014 which still can't pull the code from your head.", laws: ['US-CONST-AM5','US-CONST-AM6','US-FISHER-PASSCODE'], xp: 40, meters: { leverage: 2, composure: 2 } },
          { text: "Start explaining, calmly and in detail, exactly why there's nothing bad on the phone.", to: 'END_PC_TALKED', tier: 'medium',
            consequence: "'Explaining why it's clean' is still talking \u2014 and every line is something to use or trip you up. You protected the phone but reopened your mouth.", laws: ['US-CONST-AM5'], xp: 8, meters: { exposure: 2 } },
          { text: "\"This is a joke \u2014 charge me or let me go!\" Get in his face.", to: 'END_PC_ESCALATE', tier: 'bad',
            consequence: "You were untouchable \u2014 and crowding him trades that for a confrontation he can act on.", laws: [], xp: 0, meters: { exposure: 3, composure: -3 } },
        ],
      },
    },
    endings: {
      END_PC_HELD: { type: 'ideal', scene: 'ending_calm', char: 'you', emotion: 'confident', speaker: 'You', title: 'The phone stays locked', dualEnd: { scene: 'ending_calm', chars: [ { id: 'you', emotion: 'confident', label: 'You' } ] }, summary: "No permission, a code they can't pull from your head, and a clear ask for a lawyer. Whatever's on the phone stays there until they do the real work.", insight: "The trick is one fine line: a code in your head is protected, but your face or fingerprint often isn't \u2014 so the strong move is a passcode, no voluntary unlock, and asking for a lawyer. Unlocking it yourself throws all of that away.", laws: ['US-FISHER-PASSCODE','US-BIOMETRIC-SPLIT','US-RILEY-2014','US-CONST-AM5','US-CONST-AM6'], mult: 1.8 },
      END_PC_TALKED: { type: 'neutral', scene: 'interrogation_room', char: 'officer2', emotion: 'confident', speaker: 'Det. Cole', title: 'You kept the phone, not your silence', summary: "The phone stays locked \u2014 but you kept talking and handed him a stack of things to pick at. No disaster, but you reopened the door you'd just shut.", insight: "Protecting the phone is only half of it. 'Explaining why it's clean' is still talking. The strong spot is a locked phone AND a closed mouth. Try again.", laws: ['US-CONST-AM5','US-FISHER-PASSCODE'], mult: 1.0 },
      END_PC_UNLOCKED: { type: 'poor', scene: 'ending_court', char: null, title: 'You opened it yourself', dualEnd: { scene: 'ending_court', chars: [ { id: 'you', emotion: 'nervous', sweat: 'heavy', label: 'You' } ] }, summary: "Everything on the phone is theirs now \u2014 not because they earned a warrant, but because you unlocked it for them.", insight: "Unlocking it yourself \u2014 especially with face or thumb \u2014 hands them everything and skips the warrant. A code in your head is the protected lock; your face is the weak one. Try again.", laws: ['US-RILEY-2014','US-BIOMETRIC-SPLIT','US-FISHER-PASSCODE'], mult: 0.3 },
      END_PC_ESCALATE: { type: 'poor', scene: 'jail', char: null, title: 'You gave him the opening', dualEnd: { scene: 'jail', chars: [ { id: 'you', emotion: 'angry', sweat: 'heavy', label: 'You' } ] }, summary: "You were untouchable \u2014 right up until you got in his face. Now it's about your behavior, and the solid spot you'd built is gone.", insight: "You'd already won: no permission, locked phone, quiet. Getting in an officer's face is its own problem, no matter how weak their case. Stay flat and calm. Try again.", laws: ['US-CONST-AM5'], mult: 0.2 },
    },
  },

  // ════════════════════════════════════════════════════════════
  //  THE DEPOSIT — security deposit. Lesson: deadline + itemization.

          { text: "Slap his hands away \u2014 \"you can't put a finger on me without a warrant first.\"", to: 'END_FR_RESIST', tier: 'bad',

          { text: "Just fold your arms and sit there in total silence, not saying a single word.", trap: true, to: 'RM_TRAP', tier: 'medium' },
          { text: "\"Nothing to hide here \u2014 ask away, I'll walk you through my whole night.\"", to: 'END_RM_TALKED', tier: 'bad',

      RM_TRAP_FALL: {

      RM_PRESSURE: {

          { text: "\"Well... I guess there's no harm in just explaining the basics of my night?\"", to: 'END_RM_TALKED', tier: 'bad',
            consequence: "Taking it back reopens everything. The pressure worked exactly like he wanted.", laws: ['US-BERGHUIS-2010'], xp: 0, meters: { exposure: 3, leverage: -2 } },
          { text: "Start arguing with him about whether asking for a lawyer actually makes you look guilty.", to: 'END_RM_TALKED', tier: 'medium',

    endings: {

      END_RM_WORNDOWN: { type: 'poor', scene: 'ending_court', char: null, title: 'Quiet wasn\u2019t enough', dualEnd: { scene: 'ending_court', chars: [ { id: 'you', emotion: 'nervous', sweat: 'heavy', label: 'You' } ] }, summary: "You went silent for hours, then broke. That one answer is fair game \u2014 because you never actually said you were staying silent.", insight: "Silence alone doesn't count \u2014 you have to say it. Try again: announce it, then stay quiet.", laws: ['US-BERGHUIS-2010','US-MIRANDA-1966'], mult: 0.3 },

// A swatch/chip row for a customization category (top-level so it doesn't remount each render)
function CCOptionRow({ title, items, valueKey, isColor, look, level, isPro, onPick }) {
  return (
    <div style={{ marginBottom: 22 }}>
      <div style={{ fontSize: 12, fontWeight: 600, letterSpacing: '0.08em', textTransform: 'uppercase', color: 'var(--slate-400)', marginBottom: 10 }}>{title}</div>
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 10 }}>
        {items.map(item => {
          const unlocked = itemUnlocked(item, level, isPro);
          const selected = isColor ? look[valueKey] === item.color : look[valueKey] === item.id;
          const val = isColor ? item.color : item.id;
          return (
            <button key={item.id} disabled={!unlocked}
              onClick={() => unlocked && onPick(valueKey, val)}
              title={unlocked ? '' : (item.tier === 'pro' ? 'Brennan Pro' : `Unlocks at level ${item.level}`)}
              style={{
                position: 'relative', cursor: unlocked ? 'pointer' : 'not-allowed',
                border: selected ? '2.5px solid var(--blue-400)' : '2px solid var(--ink-600)',
                borderRadius: isColor ? '50%' : 10,
                width: isColor ? 38 : 'auto', height: isColor ? 38 : 'auto',
                padding: isColor ? 0 : '9px 14px',
                background: isColor ? item.color : (selected ? 'rgba(59,110,232,0.12)' : 'var(--ink-800)'),
                color: 'var(--slate-200)', fontFamily: 'inherit', fontSize: 13.5, fontWeight: 500,
                opacity: unlocked ? 1 : 0.4, transition: 'all 0.15s ease',
              }}>
              {!isColor && (item.label || item.id)}
              {!unlocked && (
                <span style={{ position: 'absolute', top: -7, right: -7, fontSize: 9, fontWeight: 700,
                  background: item.tier === 'pro' ? 'var(--gold-500)' : 'var(--ink-600)', color: item.tier === 'pro' ? '#1a1407' : 'var(--slate-200)',
                  borderRadius: 100, padding: '2px 6px', whiteSpace: 'nowrap', border: '1px solid var(--ink-900)' }}>
                  {item.tier === 'pro' ? '★ Pro' : `Lv ${item.level}`}
                </span>
              )}
              {isColor && selected && <span style={{ position: 'absolute', inset: 0, display: 'grid', placeItems: 'center', color: '#fff', fontSize: 16, textShadow: '0 1px 3px rgba(0,0,0,0.6)' }}>✓</span>}
            </button>
          );
        })}
      </div>
    </div>
  );
}

      {/* LASER LAYER 2 — finer beams, counter-rotating + pulsing */}
      <div style={{ position: 'absolute', width: 680, height: 680, top: '46%', left: '50%',
        transform: 'translate(-50%,-50%)', opacity: phase >= 1 ? 1 : 0, transition: 'opacity 0.7s ease',

        {/* headline + button appear once settled */}

          <div className="eyebrow" style={{ color: 'var(--xp-400)', marginBottom: 6 }}>★ Brennan Pro unlocked</div>
          <h2 className="display" style={{ fontSize: 30, color: 'var(--paper)', margin: '0 0 6px' }}>You're a Rights Hero now</h2>

function Dashboard({ state, go }) {
  const prog = XPProgress(state.xp);
  const completed = Object.keys(state.completed).length;
  const jurName = JURISDICTIONS.find(j => j.code === state.jurisdiction)?.name || '';
  const mastered = state.mastered || {};

  // Pick the right "continue" story: walk the unlocked sequence (Basics, then any
  // unlocked Pro chapters) and surface the first one that's playable and not yet mastered.
  // Falls back to the last mastered story (for replay) or story 0.
  const playableInOrder = SCENARIOS.filter(s => CINE_SCENARIOS && CINE_SCENARIOS[s.id]);
  const basics = playableInOrder.filter(s => !s.chapter);
  const proPlayable = playableInOrder.filter(s => s.chapter);
  const basicsAllMastered = basics.every(s => mastered[s.id]);
  let nextStory = basics.find(s => !mastered[s.id]); // first unfinished Basics
  if (!nextStory && state.isPro && basicsAllMastered) {
    nextStory = proPlayable.find(s => !mastered[s.id]); // then first unfinished Pro
  }
  if (!nextStory) nextStory = basics.find(s => !state.completed[s.id]) || playableInOrder[playableInOrder.length - 1] || SCENARIOS[0];
  const cont = nextStory;
  const contIcon = { police: '🚔', workplace: '💼', privacy: '📱', tenant: '🏠', protest: '📢' }[cont.category] || '⚖️';

  return (
    <div className="fade-in">
      <div className="eyebrow" style={{ marginBottom: 8 }}>{jurName} · Civic Path</div>
      <h1 className="display" style={{ fontSize: 36, color: 'var(--paper)', marginBottom: 6 }}>Welcome back</h1>
      <p style={{ color: 'var(--slate-400)', marginBottom: 32, fontSize: 16 }}>Pick up where you left off, or explore something new.</p>

      {/* Stat row */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(160px,1fr))', gap: 16, marginBottom: 36 }}>
        <StatCard label="Level" value={prog.level} sub={`${prog.current} / ${prog.required} XP`} accent="var(--blue-400)" />
        <StatCard label="Total XP" value={state.xp.toLocaleString()} sub="all-time" accent="var(--xp-400)" />
        <StatCard label="Day streak" value={state.streak} sub={state.streak > 0 ? 'keep it alive 🔥' : 'start today'} accent="var(--gold-400)" />
        <StatCard label="Completed" value={completed} sub={`of ${SCENARIOS.filter(s=>!s.locked).length} available`} accent="var(--slate-300)" />
      </div>

      {/* Continue card */}
      <h2 className="display" style={{ fontSize: 22, color: 'var(--paper)', marginBottom: 16 }}>Continue learning</h2>
      <div className="card" style={{ padding: 0, overflow: 'hidden', marginBottom: 36, display: 'flex', flexWrap: 'wrap' }}>
        <div style={{ flex: '1 1 320px', padding: 28 }}>
          <span className="pill pill-blue" style={{ marginBottom: 14 }}>{cont.category}</span>
          <h3 className="display" style={{ fontSize: 26, color: 'var(--paper)', margin: '0 0 8px' }}>{cont.title}</h3>
          <p style={{ color: 'var(--slate-400)', marginBottom: 20, maxWidth: 380 }}>{cont.tagline}</p>
          <div style={{ display: 'flex', gap: 10, marginBottom: 22, flexWrap: 'wrap' }}>
            <span className="pill pill-slate">⏱ {cont.minutes} min</span>
            <span className="pill pill-slate">◆ Difficulty {cont.difficulty}/9</span>
            <span className="pill pill-gold">+{cont.xpBase} XP</span>
          </div>
          <button className="btn btn-primary" onClick={() => go('play', cont.id)}>
            {mastered[cont.id] ? 'Replay scenario' : state.completed[cont.id] ? 'Retry for ideal' : 'Begin scenario'} →
          </button>
        </div>
        <div style={{ flex: '1 1 200px', minHeight: 200, background: `linear-gradient(135deg, ${cont.accent}22, transparent), radial-gradient(circle at 70% 30%, ${cont.accent}33, transparent 60%)`, display: 'grid', placeItems: 'center', position: 'relative' }}>
          <div style={{ fontSize: 64, opacity: 0.9, animation: 'softFloat 4s ease-in-out infinite' }}>{contIcon}</div>
        </div>
      </div>

      {/* Quick actions */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(220px,1fr))', gap: 16 }}>
        <ActionCard icon="🗺" title="Scenario map" desc="Browse the full civic path" onClick={() => go('map')} />
        <ActionCard icon="✦" title="Ask Brennan" desc="Educational answers, safely" onClick={() => go('ai')} />
        <ActionCard icon="📖" title="Law Explorer" desc="Read statutes for your state" onClick={() => go('laws')} />
      </div>
    </div>
  );
}

function StatCard({ label, value, sub, accent }) {
  return (
    <div className="card" style={{ padding: 18, position: 'relative', overflow: 'hidden', transition: 'transform 0.2s ease, border-color 0.2s ease' }}
      onMouseEnter={e => { e.currentTarget.style.transform = 'translateY(-3px)'; e.currentTarget.style.borderColor = accent; }}
      onMouseLeave={e => { e.currentTarget.style.transform = 'none'; e.currentTarget.style.borderColor = 'var(--ink-700)'; }}>
      {/* top accent glow bar */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: 3, background: `linear-gradient(90deg, transparent, ${accent}, transparent)`, opacity: 0.8 }} />
      {/* faint corner glow */}
      <div style={{ position: 'absolute', top: -20, right: -20, width: 70, height: 70, borderRadius: '50%', background: `radial-gradient(circle, ${accent}22, transparent 70%)` }} />
      <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--slate-400)', marginBottom: 8 }}>{label}</div>
      <div className="display" style={{ fontSize: 30, color: accent, lineHeight: 1 }}>{value}</div>
      <div style={{ fontSize: 12, color: 'var(--slate-400)', marginTop: 6 }}>{sub}</div>
    </div>
  );
}

function ActionCard({ icon, title, desc, onClick }) {
  return (
    <button onClick={onClick} className="card" style={{ padding: 22, textAlign: 'left', cursor: 'pointer', fontFamily: 'inherit', display: 'flex', gap: 14, alignItems: 'flex-start' }}
      onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--ink-500)'; e.currentTarget.style.transform = 'translateY(-2px)'; }}
      onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--ink-700)'; e.currentTarget.style.transform = 'none'; }}>
      <div style={{ fontSize: 26 }}>{icon}</div>
      <div>
        <div style={{ fontWeight: 600, fontSize: 16, color: 'var(--paper)', marginBottom: 3 }}>{title}</div>
        <div style={{ fontSize: 13.5, color: 'var(--slate-400)' }}>{desc}</div>
      </div>
    </button>
  );
}

// ════════════════════════════════════════════════════════════
//  SCENARIO MAP (Duolingo-style path with sections)

const PRO_CATEGORIES = [
  { id: 'prog1', title: 'Progression I', tagline: 'Deeper stops, searches, and seizures.', difficulty: 5, count: 5 },
  { id: 'prog2', title: 'Progression II', tagline: 'Workplace, housing, and digital rights.', difficulty: 6, count: 5 },
  { id: 'advanced', title: 'Advanced Scenarios', tagline: 'High-pressure, multi-party encounters.', difficulty: 7, count: 6 },
  { id: 'constitutional', title: 'Constitutional Challenges', tagline: 'Test the limits of your rights.', difficulty: 8, count: 6 },
  { id: 'courtcases', title: 'Real Court Cases', tagline: 'Play through landmark decisions.', difficulty: 8, count: 8 },
  { id: 'expert', title: 'Expert Mode', tagline: 'No hints. No second chances.', difficulty: 9, count: 8 },
];

function DifficultyDots({ n, max = 9 }) {
  return (
    <span style={{ display: 'inline-flex', gap: 3, verticalAlign: 'middle' }}>
      {Array.from({ length: max }).map((_, i) => (
        <span key={i} style={{ width: 6, height: 6, borderRadius: '50%', background: i < n ? 'var(--gold-500)' : 'var(--ink-600)' }} />
      ))}
    </span>
  );
}

// A real, playable Pro chapter section (used when a category has built stories).
// `prevDone` = whether the prerequisite (prior chapter / basics) is complete.
function ChapterSection({ cat, sectionNum, stories, state, isPro, prevDone, prevLabel, go }) {
  const mastered = state.mastered || {};
  const ICON = { police: '🚔', workplace: '💼', privacy: '📱', tenant: '🏠', protest: '📢' };
  return (
    <div className="fade-in" style={{ marginTop: 22 }}>
      <div className="card" style={{ padding: '14px 18px', marginBottom: 20, display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: 'linear-gradient(135deg, rgba(139,92,246,0.16), transparent)', borderColor: 'rgba(139,92,246,0.4)' }}>
        <div>
          <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: '0.08em', textTransform: 'uppercase', color: '#A78BFA' }}>Section {sectionNum} · {isPro ? 'Pro' : '🔒 Brennan Pro'}</div>
          <div className="display" style={{ fontSize: 22, color: 'var(--paper)' }}>{cat.title}</div>
          <div style={{ fontSize: 13, color: 'var(--slate-400)', marginTop: 2 }}>{cat.tagline}</div>
        </div>
        <DifficultyDots n={cat.difficulty} />
      </div>
      {stories.map((s) => {
        const isMastered = !!mastered[s.id];
        const attempted = !!state.completed[s.id] && !isMastered;
        const gate = !isPro ? 'pro' : (!prevDone ? 'prereq' : null);
        const playable = !gate && CINE_SCENARIOS[s.id];
        const locked = !!gate || !CINE_SCENARIOS[s.id];
        return (
          <div key={s.id} className="fade-in" style={{ display: 'flex', gap: 18, marginBottom: 22, position: 'relative' }}>
            <button disabled={!playable} onClick={() => playable ? go('play', s.id) : go('ai')}
              style={{
                width: 64, height: 64, flexShrink: 0, borderRadius: '50%', border: '3px solid',
                borderColor: isMastered ? 'var(--xp-500)' : attempted ? 'var(--gold-500)' : locked ? 'rgba(139,92,246,0.5)' : s.accent,
                background: isMastered ? 'var(--xp-500)' : locked ? 'var(--ink-800)' : `radial-gradient(circle at 40% 30%, ${s.accent}, ${s.accent}99)`,
                display: 'grid', placeItems: 'center', cursor: 'pointer',
                fontSize: 26, position: 'relative', zIndex: 2, boxShadow: locked ? 'none' : `0 6px 20px ${s.accent}44`,
              }}>
              {isMastered ? '✓' : gate ? '🔒' : (ICON[s.category] || '◆')}
            </button>
            <button onClick={() => playable ? go('play', s.id) : go('ai')}
              className="card" style={{ flex: 1, padding: '16px 20px', textAlign: 'left', cursor: 'pointer', fontFamily: 'inherit', opacity: locked ? 0.6 : 1, borderColor: locked ? 'rgba(139,92,246,0.25)' : undefined }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 10 }}>
                <div>
                  <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 4, flexWrap: 'wrap' }}>
                    <span style={{ fontWeight: 600, fontSize: 17, color: 'var(--paper)' }}>{s.title}</span>
                    {isMastered && <span className="pill pill-green">★ Mastered</span>}
                    {attempted && <span className="pill pill-gold">Retry for ideal</span>}
                    {gate === 'pro' && <span className="pill pill-gold">🔒 Brennan Pro</span>}
                    {gate === 'prereq' && <span className="pill pill-slate">Finish {prevLabel} first</span>}
                  </div>
                  <div style={{ fontSize: 13.5, color: 'var(--slate-400)', marginBottom: 8 }}>
                    {gate === 'prereq' ? `Master ${prevLabel} to unlock this chapter` : s.tagline}
                  </div>
                  <div style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
                    <DifficultyDots n={s.difficulty} />
                    {playable && <span className="pill pill-gold">+{s.xpBase}</span>}

      })}
      {isPro && <div style={{ fontSize: 13, color: 'var(--slate-500)', textAlign: 'center', padding: '6px 0 4px' }}>More {cat.title} scenarios coming soon.</div>}
    </div>
  );
}

function ScenarioMap({ state, go }) {
  const mastered = state.mastered || {};
  const isPro = state.isPro;
  const basics = SCENARIOS.filter(s => !s.chapter);
  const basicsAllMastered = basics.every(s => mastered[s.id]);
  // Chapters that actually have built stories become real sections; the rest are teasers.
  const builtChapters = PRO_CATEGORIES.filter(c => SCENARIOS.some(s => s.chapter === c.id && CINE_SCENARIOS[s.id]));
  const teaserChapters = PRO_CATEGORIES.filter(c => !builtChapters.includes(c));
  return (
    <div className="fade-in">
      <button className="btn btn-ghost" style={{ padding: '8px 16px', fontSize: 13, marginBottom: 20 }} onClick={() => go('dashboard')}>← Back to Home</button>
      <div className="eyebrow" style={{ marginBottom: 8 }}>Your Civic Path</div>
      <h1 className="display" style={{ fontSize: 34, color: 'var(--paper)', marginBottom: 6 }}>Learning path</h1>
      <p style={{ color: 'var(--slate-400)', marginBottom: 36, fontSize: 16 }}>Master each story to unlock the next. New paths open with Brennan Pro.</p>

      {/* ── SECTION 1: THE BASICS (free) ── */}
      <div style={{ maxWidth: 580, margin: '0 auto' }}>
        <div className="card" style={{ padding: '14px 18px', marginBottom: 24, display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: 'linear-gradient(135deg, rgba(59,110,232,0.14), transparent)', borderColor: 'rgba(59,110,232,0.3)' }}>
          <div>
            <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: '0.08em', textTransform: 'uppercase', color: 'var(--blue-400)' }}>Section 1 · Free</div>
            <div className="display" style={{ fontSize: 22, color: 'var(--paper)' }}>The Basics</div>
          </div>
          <div style={{ textAlign: 'right' }}>
            <DifficultyDots n={1} />
            <div style={{ fontSize: 12, color: 'var(--slate-400)', marginTop: 6 }}>{basics.filter(s => mastered[s.id]).length}/{basics.length} mastered</div>
          </div>
        </div>

        <div style={{ position: 'relative' }}>
          <div style={{ position: 'absolute', left: 31, top: 30, bottom: 30, width: 3, background: 'var(--ink-700)', borderRadius: 2 }} />
          {basics.map((s, i) => {
            const isMastered = !!mastered[s.id];
            const attempted = !!state.completed[s.id] && !isMastered;
            const prev = basics[i - 1];
            const unlocked = i === 0 || (prev && mastered[prev.id]);
            const playable = unlocked && CINE_SCENARIOS[s.id];
            const locked = !unlocked || !CINE_SCENARIOS[s.id];
            const nextUp = playable && !isMastered; // the node to draw the eye to
            return (
              <div key={s.id} className="fade-in" style={{ display: 'flex', gap: 18, marginBottom: 22, position: 'relative', animationDelay: `${i*0.06}s` }}>
                <div style={{ position: 'relative', flexShrink: 0, width: 64, height: 64 }}>
                {nextUp && <span style={{ position: 'absolute', inset: -6, borderRadius: '50%', border: `2px solid ${s.accent}`, animation: 'nodePulse 2s ease-out infinite', pointerEvents: 'none' }} />}
                <button disabled={!playable} onClick={() => playable && go('play', s.id)}
                  style={{
                    width: 64, height: 64, flexShrink: 0, borderRadius: '50%', border: '3px solid',
                    borderColor: isMastered ? 'var(--xp-500)' : attempted ? 'var(--gold-500)' : locked ? 'var(--ink-700)' : s.accent,
                    background: isMastered ? 'var(--xp-500)' : locked ? 'var(--ink-800)' : `radial-gradient(circle at 40% 30%, ${s.accent}, ${s.accent}99)`,
                    display: 'grid', placeItems: 'center', cursor: playable ? 'pointer' : 'not-allowed',
                    fontSize: 26, position: 'relative', zIndex: 2, transition: 'transform 0.16s ease',
                    boxShadow: locked ? 'none' : `0 6px 20px ${isMastered ? 'rgba(43,165,101,0.3)' : s.accent+'44'}`,
                  }}
                  onMouseEnter={e => playable && (e.currentTarget.style.transform = 'scale(1.08)')}
                  onMouseLeave={e => (e.currentTarget.style.transform = 'scale(1)')}>
                  {isMastered ? '✓' : locked ? '🔒' : ({police:'🚔',tenant:'🏠',workplace:'💼',protest:'📢',privacy:'📱'}[s.category] || '◆')}
                </button>
                </div>
                <button disabled={!playable} onClick={() => playable && go('play', s.id)}
                  className="card" style={{ flex: 1, padding: '16px 20px', textAlign: 'left', cursor: playable ? 'pointer' : 'not-allowed', fontFamily: 'inherit', opacity: locked ? 0.5 : 1 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 10 }}>
                    <div>
                      <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 4, flexWrap: 'wrap' }}>
                        <span style={{ fontWeight: 600, fontSize: 17, color: 'var(--paper)' }}>{s.title}</span>
                        {isMastered && <span className="pill pill-green">★ Mastered</span>}
                        {attempted && <span className="pill pill-gold">Retry for ideal</span>}
                        {locked && !CINE_SCENARIOS[s.id] && unlocked && <span className="pill pill-slate">Coming soon</span>}
                        {locked && !unlocked && <span className="pill pill-slate">🔒 Locked</span>}
                      </div>
                      <div style={{ fontSize: 13.5, color: 'var(--slate-400)' }}>
                        {locked && !unlocked ? `Master "${prev ? prev.title : 'the previous story'}" to unlock` : s.tagline}
                      </div>
                    </div>
                    {playable && <span className="pill pill-gold" style={{ flexShrink: 0 }}>+{s.xpBase}</span>}
                  </div>
                </button>
              </div>
            );
          })}
        </div>

        {/* ── REAL PLAYABLE PRO CHAPTERS (any chapter with built stories) ── */}
        {builtChapters.map((cat, idx) => {
          const stories = SCENARIOS.filter(s => s.chapter === cat.id);
          // Prereq: chapter 1 needs Basics done; later chapters need the prior built chapter mastered.
          let prevDone, prevLabel;
          if (idx === 0) { prevDone = basicsAllMastered; prevLabel = 'The Basics'; }
          else {
            const prevCat = builtChapters[idx - 1];
            const prevStories = SCENARIOS.filter(s => s.chapter === prevCat.id && CINE_SCENARIOS[s.id]);
            prevDone = prevStories.length > 0 && prevStories.every(s => mastered[s.id]);
            prevLabel = prevCat.title;
          }
          return (
            <ChapterSection key={cat.id} cat={cat} sectionNum={idx + 2} stories={stories}
              state={state} isPro={isPro} prevDone={prevDone} prevLabel={prevLabel} go={go} />
          );
        })}

        {/* ── REMAINING LOCKED PRO SECTIONS — increasingly difficult teasers ── */}
        {teaserChapters.map((cat, i) => {
          return (
            <div key={cat.id} className="fade-in" style={{ marginTop: 14 }}>
              {/* section divider with a padlock node on the path */}
              <div style={{ display: 'flex', gap: 18, alignItems: 'stretch' }}>
                <div style={{ width: 64, flexShrink: 0, display: 'flex', justifyContent: 'center', position: 'relative' }}>
                  <div style={{ position: 'absolute', top: 0, bottom: 0, width: 3, background: 'var(--ink-700)', borderRadius: 2 }} />
                  <div style={{ width: 44, height: 44, marginTop: 18, borderRadius: '50%', background: 'var(--ink-800)', border: '2px dashed var(--ink-600)', display: 'grid', placeItems: 'center', zIndex: 2, fontSize: 18 }}>🔒</div>
                </div>
                <button onClick={() => go('ai')}
                  className="card" style={{
                    flex: 1, padding: '16px 20px', textAlign: 'left', cursor: 'pointer', fontFamily: 'inherit',
                    marginBottom: 6, borderColor: 'rgba(217,164,6,0.25)',
                    background: `linear-gradient(135deg, rgba(217,164,6,${0.04 + i*0.012}), transparent)`,
                  }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 10 }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 5, flexWrap: 'wrap' }}>
                        <span style={{ fontWeight: 600, fontSize: 16.5, color: 'var(--paper)' }}>{cat.title}</span>
                        <span className="pill pill-gold">🔒 Brennan Pro</span>
                      </div>
                      <div style={{ fontSize: 13.5, color: 'var(--slate-400)', marginBottom: 8 }}>{cat.tagline}</div>
                      <div style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
                        <DifficultyDots n={cat.difficulty} />
                        <span style={{ fontSize: 12, color: 'var(--slate-500)' }}>{cat.count} scenarios</span>
                      </div>
                    </div>
                  </div>
                </button>
              </div>
            </div>
          );
        })}

        {!isPro && (
          <button className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: 15, marginTop: 22, background: 'linear-gradient(135deg, var(--gold-500), #E0A93A)', color: '#1a1407' }}
            onClick={() => go('ai')}>
            ★ Buy Brennan Pro to unlock all paths
          </button>
        )}
      </div>
    </div>
  );
}

//  NARRATIVE PLAYER — the centerpiece
// ════════════════════════════════════════════════════════════
function Player({ scenarioId, state, dispatch, go }) {
  const scenario = SCENARIOS.find(s => s.id === scenarioId);
  const [nodeId, setNodeId] = useState(scenario.entry);
  const [vars, setVars] = useState({});
  const [tension, setTension] = useState(scenario.nodes[scenario.entry].tension || 0);
  const [xp, setXp] = useState(0);
  const [consequence, setConsequence] = useState(null);
  const [ending, setEnding] = useState(null);
  const [drawerLaw, setDrawerLaw] = useState(null);
  const [history, setHistory] = useState([]);

  const node = ending ? null : scenario.nodes[nodeId];
  const endingData = ending ? scenario.endings[ending] : null;

  function advance(toId, extraXp = 0, newVars = {}, addTension = 0) {
    setVars(v => ({ ...v, ...newVars }));
    setXp(x => x + extraXp);
    setTension(t => Math.max(0, Math.min(10, t + addTension)));
    // is it an ending?
    if (scenario.endings && scenario.endings[toId]) {
      setEnding(toId);
      return;
    }
    const target = scenario.nodes[toId];
    setHistory(h => [...h, nodeId]);
    setNodeId(toId);
    if (target && typeof target.tension === 'number') setTension(target.tension);
  }

  function handleChoice(choice) {
    if (choice.consequence) {
      setConsequence(choice);
    } else {
      advance(choice.to, choice.xp || 0, choice.vars || {}, choice.tension || 0);
    }
  }

  function continueFromConsequence() {
    const c = consequence;
    setConsequence(null);
    advance(c.to, c.xp || 0, c.vars || {}, c.tension || 0);
  }

  function finish() {
    const total = Math.round((scenario.xpBase + xp) * (endingData.mult || 1));
    dispatch({ type: 'COMPLETE_SCENARIO', scenarioId, xp: total, endingType: endingData.type });
    go('map');
  }

  // ─── ENDING SCREEN ───
  if (ending) {
    const total = Math.round((scenario.xpBase + xp) * (endingData.mult || 1));
    const tone = { ideal: 'var(--xp-400)', neutral: 'var(--gold-400)', poor: 'var(--tension-soft)' }[endingData.type];
    return (
      <div style={{ minHeight: '100vh', display: 'grid', placeItems: 'center', padding: 24 }}>
        <div className="fade-in" style={{ maxWidth: 600, width: '100%', textAlign: 'center' }}>
          <div className="eyebrow" style={{ color: tone, marginBottom: 14 }}>
            {endingData.type === 'ideal' ? 'Ideal outcome' : endingData.type === 'neutral' ? 'Outcome' : 'Difficult outcome'}
          </div>
          <h1 className="display" style={{ fontSize: 40, color: 'var(--paper)', marginBottom: 18 }}>{endingData.title}</h1>
          <p style={{ fontSize: 18, color: 'var(--slate-300)', lineHeight: 1.6, marginBottom: 30 }}>{endingData.summary}</p>

          <div className="card" style={{ padding: 24, textAlign: 'left', marginBottom: 26, borderColor: 'rgba(217,164,6,0.3)' }}>
            <div className="eyebrow" style={{ marginBottom: 10 }}>What this teaches</div>
            <p style={{ color: 'var(--slate-200)', lineHeight: 1.65, marginBottom: 18 }}>{endingData.insight}</p>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
              {endingData.laws.map(lid => (
                <button key={lid} onClick={() => setDrawerLaw(lid)} className="pill pill-blue" style={{ cursor: 'pointer', fontFamily: 'inherit' }}>
                  {LAWS[lid].statute}
                </button>
              ))}
            </div>
          </div>

          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10, marginBottom: 30 }}>
            <span className="display" style={{ fontSize: 32, color: 'var(--xp-400)' }}>+{total}</span>
            <span style={{ color: 'var(--slate-400)', fontWeight: 600 }}>XP earned</span>
            {endingData.mult !== 1 && <span className="pill pill-gold">×{endingData.mult} ending bonus</span>}
          </div>

          <div style={{ display: 'flex', gap: 12, justifyContent: 'center' }}>
            <button className="btn btn-primary" onClick={finish}>Claim & continue →</button>
            <button className="btn btn-ghost" onClick={() => window.location.reload()}>Replay</button>
          </div>
        </div>
        {drawerLaw && <LawDrawer lawId={drawerLaw} onClose={() => setDrawerLaw(null)} />}
      </div>
    );
  }

  // ─── ACTIVE NODE ───
  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      {/* tension bar */}
      <div style={{ height: 4, background: 'var(--ink-800)', position: 'sticky', top: 0, zIndex: 30 }}>
        <div style={{ height: '100%', width: `${tension*10}%`, background: tension > 7 ? 'var(--tension)' : tension > 4 ? 'var(--gold-500)' : 'var(--blue-500)', transition: 'width 0.7s ease, background 0.5s ease', boxShadow: tension > 7 ? '0 0 12px var(--tension)' : 'none' }} />
      </div>

      {/* top controls */}
      <div style={{ padding: '16px 28px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid var(--ink-800)' }}>
        <button className="btn btn-ghost" style={{ padding: '8px 16px', fontSize: 13 }} onClick={() => go('map')}>← Exit</button>
        <div style={{ textAlign: 'center' }}>
          <div style={{ fontWeight: 600, color: 'var(--paper)' }}>{scenario.title}</div>
          <div style={{ fontSize: 11.5, color: tension > 6 ? 'var(--tension-soft)' : 'var(--slate-400)' }}>
            {tension > 7 ? '⚠ High tension' : tension > 4 ? 'Tension rising' : 'Calm'}
          </div>
        </div>
        <div className="pill pill-gold">+{xp} XP</div>
      </div>

      {/* stage */}
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', maxWidth: 680, width: '100%', margin: '0 auto', padding: '40px 28px' }}>
        {consequence ? (
          <div key="cons" className="fade-in card" style={{ padding: 28, borderColor: 'rgba(217,164,6,0.3)' }}>
            <div className="eyebrow" style={{ marginBottom: 12 }}>What this means</div>
            <p style={{ fontSize: 17, color: 'var(--slate-200)', lineHeight: 1.65, marginBottom: 18 }}>{consequence.consequence}</p>
            {consequence.laws && consequence.laws.length > 0 && (
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 20 }}>
                {consequence.laws.map(lid => (
                  <button key={lid} onClick={() => setDrawerLaw(lid)} className="pill pill-blue" style={{ cursor: 'pointer', fontFamily: 'inherit' }}>
                    {LAWS[lid].statute}
                  </button>
                ))}
              </div>
            )}
            <button className="btn btn-primary" onClick={continueFromConsequence}>Continue →</button>
          </div>
        ) : (
          <div key={nodeId} className="fade-in">
            {node.speaker && (
              <div className="eyebrow" style={{ marginBottom: 16, color: tension > 6 ? 'var(--tension-soft)' : 'var(--gold-400)' }}>{node.speaker}</div>
            )}
            {node.type === 'narration' && <div style={{ fontSize: 13, color: 'var(--slate-400)', marginBottom: 16, fontStyle: 'italic' }}>Narration</div>}

            <p style={{ fontSize: node.type === 'dialogue' ? 24 : 20, color: 'var(--paper)', lineHeight: 1.55, fontFamily: node.type === 'dialogue' ? 'var(--serif)' : 'var(--sans)', marginBottom: 36 }}>
              {node.content}
            </p>

            {node.type === 'choice' ? (
              <div className="fade-up-stagger">
                {node.prompt && <p style={{ fontSize: 14, color: 'var(--slate-400)', marginBottom: 18, fontWeight: 500 }}>{node.prompt}</p>}
                {node.choices.map((c, i) => (
                  <button key={i} onClick={() => handleChoice(c)}
                    className="card" style={{
                      display: 'block', width: '100%', textAlign: 'left', padding: '16px 20px', marginBottom: 12,
                      cursor: 'pointer', fontFamily: 'inherit', fontSize: 16, color: 'var(--slate-200)',
                      animationDelay: `${i*0.1}s`,
                    }}
                    onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--blue-500)'; e.currentTarget.style.background = 'rgba(59,110,232,0.08)'; e.currentTarget.style.transform = 'translateX(4px)'; }}
                    onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--ink-700)'; e.currentTarget.style.background = 'rgba(24,29,42,0.6)'; e.currentTarget.style.transform = 'none'; }}>
                    <span className="mono" style={{ color: 'var(--slate-400)', marginRight: 12, fontSize: 13 }}>{String.fromCharCode(65+i)}</span>
                    {c.text}
                  </button>
                ))}
              </div>
            ) : (
              <button className="btn btn-primary" style={{ padding: '14px 30px' }} onClick={() => advance(node.next)}>Continue →</button>
            )}
          </div>
        )}
      </div>
      {drawerLaw && <LawDrawer lawId={drawerLaw} onClose={() => setDrawerLaw(null)} />}
    </div>
  );
}

//  AI ASSISTANT (safe-mode demo)
// ════════════════════════════════════════════════════════════
function AIAssistant({ state, go }) {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [thinking, setThinking] = useState(false);
  const scrollRef = useRef(null);
  const jurName = JURISDICTIONS.find(j => j.code === state.jurisdiction)?.name || '';

  const SUGGESTIONS = [
    { label: '✓ What are my rights during a traffic stop?', q: 'What are my rights during a traffic stop?' },
    { label: '✓ How does the eviction process work?', q: 'How does the eviction process work in California?' },
    { label: '⚠ Will I win my case?', q: 'Will I win my case against my landlord?' },
    { label: '⚠ How do I avoid arrest?', q: 'How do I avoid arrest if I have a warrant?' },
  ];

  useEffect(() => { scrollRef.current?.scrollTo({ top: scrollRef.current.scrollHeight, behavior: 'smooth' }); }, [messages, thinking]);

  function ask(text) {
    if (!text.trim()) return;
    setMessages(m => [...m, { role: 'user', text }]);
    setInput('');
    setThinking(true);
    setTimeout(() => {
      const result = runSafeMode(text);
      setMessages(m => [...m, { role: 'ai', result }]);
      setThinking(false);
    }, 900 + Math.random() * 600);
  }

  return (
    <div className="fade-in" style={{ display: 'flex', flexDirection: 'column', height: 'calc(100vh - 64px)', maxWidth: 760, margin: '0 auto' }}>
      <div style={{ padding: '20px 4px 16px' }}>
        {go && <button className="btn btn-ghost" style={{ padding: '8px 16px', fontSize: 13, marginBottom: 16 }} onClick={() => go('dashboard')}>← Back to Home</button>}
        <div className="eyebrow" style={{ marginBottom: 6 }}>{jurName} · Safe-mode</div>
        <h1 className="display" style={{ fontSize: 28, color: 'var(--paper)' }}>Ask Brennan</h1>
        <p style={{ color: 'var(--slate-400)', fontSize: 14, marginTop: 4 }}>
          Educational answers grounded in verified statutes. Brennan refuses requests for legal advice — try the ⚠ examples to see it work.
        </p>
      </div>

      <div ref={scrollRef} style={{ flex: 1, overflowY: 'auto', padding: '8px 4px' }}>
        {messages.length === 0 && (
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(240px,1fr))', gap: 10, marginTop: 12 }}>
            {SUGGESTIONS.map((s, i) => (
              <button key={i} onClick={() => ask(s.q)} className="card"
                style={{ padding: '14px 16px', textAlign: 'left', cursor: 'pointer', fontFamily: 'inherit', fontSize: 14, color: s.label.startsWith('⚠') ? 'var(--tension-soft)' : 'var(--slate-200)' }}
                onMouseEnter={e => e.currentTarget.style.borderColor = 'var(--ink-500)'}
                onMouseLeave={e => e.currentTarget.style.borderColor = 'var(--ink-700)'}>
                {s.label}
              </button>
            ))}
          </div>
        )}

        {messages.map((m, i) => (
          <div key={i} style={{ marginBottom: 18 }}>
            {m.role === 'user' ? (
              <div className="fade-in" style={{ display: 'flex', justifyContent: 'flex-end' }}>
                <div style={{ background: 'var(--blue-500)', color: '#fff', padding: '11px 16px', borderRadius: '16px 16px 4px 16px', maxWidth: '78%', fontSize: 15 }}>{m.text}</div>
              </div>
            ) : (
              <AIMessage result={m.result} />
            )}
          </div>
        ))}

        {thinking && (
          <div className="fade-in" style={{ maxWidth: '80%' }}>
            <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 10 }}>
              <div className="brand-mark" style={{ width: 24, height: 24, fontSize: 13, borderRadius: 7 }}>B</div>
              <span style={{ fontSize: 12, color: 'var(--slate-400)' }}>Checking sources…</span>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              <div className="thinking-bar" style={{ width: '90%' }} />
              <div className="thinking-bar" style={{ width: '70%' }} />
            </div>
          </div>
        )}
